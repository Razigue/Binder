[project]
name = "binder"
version = "0.1.0"
description = "Binder: AI administrative agent, 100% local"
authors = [
    { name = "Razigue Ben Hmida", email = "razigue.benhmida@epitech.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    # OCR of photos and scans; its models ship inside the wheel (nothing downloaded at runtime).
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    # Linux, macOS (Intel, Apple Silicon) and Windows wheels; imported as `sqlcipher3`.
    "segno>=1.6.6",
    "sqlcipher3-wheels>=0.5.7",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    # Watched folder: system change notifications (also pulled by uvicorn[standard]).
    "watchfiles>=1.3.0",
    # Ollama for Linux ships as .tar.zst (installed automatically, services/setup.py).
    "zstandard>=0.23",
]

[project.optional-dependencies]
desktop = [
    # Native web engine on Windows (Edge WebView2) and macOS (WebKit), Qt WebEngine on Linux.
    "pywebview>=6.2.1",
    "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
    # Installer and delta updates (Setup.exe, .pkg, AppImage), see binder.updater.
    "velopack>=1.2.161",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
binder = "binder.cli:main"

[tool.uv]
# RapidOCR asks for the GUI build of OpenCV; the headless build above provides the same `cv2`
# module without needing a display (servers, CI).
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF is only partially typed.
module = [
    "binder.samples",
    "binder.services.text",
    "binder.services.scan_image",
    "binder.services.sources",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
