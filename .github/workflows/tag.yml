name: Tag

# A pull request merged into main tags its merge commit with the next version and starts the
# "Release" workflow on that tag. Bump from the PR labels: "major", "minor", otherwise patch;
# "no-release" merges without a tag.
# A tag pushed with GITHUB_TOKEN triggers no workflow, hence the explicit dispatch: run on the
# tag's ref, "Release" sees refs/tags/v* and publishes.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Next version
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Latest stable tag: pre-releases (v1.3.0-beta.1) do not count.
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vE -- '-' | head -n1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          if grep -q '"major"' <<< "$LABELS"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -q '"minor"' <<< "$LABELS"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "TAG=v$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "${last:-none} -> v$major.$minor.$patch"
      - name: Push tag
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
      - name: Start release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
