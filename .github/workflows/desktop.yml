name: Application de bureau

# Construit Binder pour Linux, Windows et macOS. Les archives sont dans l'onglet « Actions »
# (artefacts du run) ; un tag v* les attache aussi à une release GitHub.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Binder-linux-x64
          - os: windows-latest
            name: Binder-windows-x64
          - os: macos-latest
            name: Binder-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python packaging/build.py
      - name: Archive
        shell: bash
        run: |
          cd packaging/dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent Binder.app ../../${{ matrix.name }}.zip
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a ../../${{ matrix.name }}.zip Binder
          else
            tar czf ../../${{ matrix.name }}.tar.gz Binder
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.*
